# RESTgym API manifest
manifest_version: 1

id: notebook-manager
name: NoteBook Manager
version: "0.0.1-SNAPSHOT"         # Implementation-Version of notebookmanager.jar
description: CRUD operations on a catalog of notebooks and their prices.
domain: e-commerce
# license:                        # not declared in the upstream repository
repository: https://github.com/birddevelper/NoteBookManager
technology:
  language: java
  framework: Spring Boot          # 2.6.3
  database: MySQL                 # 8.0, in the container; the API creates its table and inserts its sample data at startup

original_specification:           # OpenAPI 3.0.1, generated by springdoc (minified), served by the API at /v3/api-docs
  version: "3.0"
  format: json
  origin: generated
  created_by: springdoc-openapi 1.6.4
  file: original/notebook-manager-openapi.json
  source: "runtime: /v3/api-docs"

authentication: none

# 5XX responses are almost all empty (one failure). The others are the default errors of Spring, {timestamp, status,
# error, path}, with no message: the error and the endpoint are kept (the timestamp is dropped, and the id in the path,
# often a value sent by the tool, is replaced); and the HTML error pages of Tomcat (e.g., 501): their title is kept
server_errors:
  similarity_threshold: 0.7
  preprocessing:
    - replace: {pattern: '("path":"/api/notebooks)/[^"]*', with: '\1/<id>'}
    - json_fields: {fields: [error, path]}
    - extract: {pattern: '(?s)<title>(.*?)</title>', group: 1}
